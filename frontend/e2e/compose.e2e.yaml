# The stack the end-to-end suite runs against: the real bunker behind the real frontend proxy.
# global-setup.ts starts it with a throwaway key and tears it down afterwards; see the
# "End-to-end tests" section of ../README.md. It is not a deployment example: use ../../compose.yaml.
#
# The key is encrypted at rest, as in a deployment (#94). stack.ts creates a throwaway root
# credential and data directory, runs `bunker import-key` once with BUNKER_NSEC passed through the
# environment only (`run -e BUNKER_NSEC`), and then starts the stack without it.
name: bancwr-e2e

services:
  bunker:
    image: bancwr-backend:e2e
    build: ../../backend
    environment:
      - BANCWR_ROOT_KEY_FILE=/run/secrets/bancwr_root_key
      - BUNKER_PORT=3000
      - RUST_LOG=info
      - DATABASE_PATH=/data/bancwr.db
      # Set at runtime rather than as a build arg, so version.spec.ts checks what the running
      # container reports without depending on a rebuild (#35).
      - BANCWR_VERSION=0.0.0-e2e
      # Sign-in (#11): the proxy secret both services share, and the first administrator, a
      # throwaway key global-setup.ts generates.
      - BANCWR_PROXY_SECRET=${E2E_PROXY_SECRET:?global-setup.ts generates E2E_PROXY_SECRET}
      - BANCWR_ADMIN_PUBKEY=${E2E_ADMIN_NPUB:?global-setup.ts generates E2E_ADMIN_NPUB}
      # NIP-46 on (#31), through the in-process relay global-setup.ts starts on the host, which
      # e2e-host names from inside the container.
      - NIP46_ENABLED=true
      - NIP46_RELAYS=ws://e2e-host:${E2E_RELAY_PORT:-7777}
    extra_hosts:
      - "e2e-host:host-gateway"
    # A throwaway directory per run, removed by stack.ts afterwards: `import-key` writes the key file
    # here and the bunker reads it, so it cannot be a tmpfs. The bunker runs as UID 65532 (#16);
    # stack.ts makes the directory world-writable so that works under both Docker and Podman.
    volumes:
      - ${E2E_DATA_DIR:?stack.ts sets E2E_DATA_DIR}:/data:Z
    secrets:
      - bancwr_root_key
    # No published port: the browser reaches the bunker only through the frontend proxy, which is
    # the path under test.

  frontend:
    image: bancwr-frontend:e2e
    build: ..
    environment:
      - NUXT_API_BASE=http://bunker:3000
      - BANCWR_VERSION=0.0.0-e2e
      - NUXT_PROXY_SECRET=${E2E_PROXY_SECRET:?global-setup.ts generates E2E_PROXY_SECRET}
      - NUXT_SESSION_PASSWORD=${E2E_SESSION_PASSWORD:?global-setup.ts generates E2E_SESSION_PASSWORD}
      # The origin the browser uses. http is allowed here only because it is localhost.
      - NUXT_SITE_ORIGIN=http://localhost:${E2E_PORT:-3100}
      # The profile page (#30) reads and publishes through the in-process relay, which the browser
      # reaches on the host, and uploads to a Blossom host the specs answer with page.route.
      - NUXT_PUBLIC_PROFILE_RELAYS=ws://127.0.0.1:${E2E_RELAY_PORT:-7777}
      # A second in-process relay as the indexer (#62).
      - NUXT_PUBLIC_INDEXER_RELAYS=ws://127.0.0.1:${E2E_INDEXER_PORT:-7778}
      - NUXT_PUBLIC_BLOSSOM_SERVER=https://blossom.e2e.test
    ports:
      # 3100, not 3000 or 3001, so the suite can run beside `pnpm dev` and the quickstart compose.
      - "${E2E_PORT:-3100}:3000"
    depends_on:
      - bunker

secrets:
  bancwr_root_key:
    file: ${E2E_ROOT_KEY_FILE:?stack.ts sets E2E_ROOT_KEY_FILE}
