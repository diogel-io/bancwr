name: Release

# The release PR, the tag and the GitHub release (docs/releasing.md). release-please keeps one
# release PR, "chore(release): <version>", open against master: it sets the version from the
# Conventional Commits merged since the last tag, writes CHANGELOG.md and bumps compose.yaml.
# Merging that PR is the release. This workflow then:
#   1. creates the v<version> tag and the GitHub release, as a draft;
#   2. builds, tests, scans, publishes and signs both images for the tag, each attaching its
#      digest, SBOM and checksums to the draft;
#   3. publishes the release once it lists all six assets;
#   4. closes the version's milestone.
# The organisation enforces immutable releases: once a release is published, its assets cannot
# change, so they are attached while it is still a draft. A failed image leaves the release a
# draft: fix the cause and re-run this run's failed jobs.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # One release-please run at a time, queued rather than cancelled, so two quick merges to
    # master cannot race each other into duplicate tags or releases. Only this job is serialised:
    # the image builds after it take a while and need not hold up the next release PR update.
    concurrency:
      group: bancwr-release
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # release-please-config.json sets draft and force-tag-creation: the tag is created on the
      # merge commit straight away, and the release stays a draft until publish-release.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  # The tag as a release target, and whether it takes :latest, by the same rules as a dispatched
  # rebuild of a tag (.github/scripts/release-targets.sh).
  targets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.targets.outputs.target }}
    steps:
      # Every tag, to find the highest release, including the one just created.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: targets
        env:
          EVENT: workflow_dispatch
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_REF: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          target=$(bash .github/scripts/release-targets.sh | jq -c '.[0]')
          echo "Target: ${target}"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  # Called, not dispatched, so publish-release can wait for both. A tag created with the workflow
  # token does not start the `on: push: tags` runs of Release Backend and Release Frontend, so the
  # tag is built only here. The signing identity is the same as theirs: release-image.yml, at the
  # ref this run started from, refs/heads/master.
  images:
    needs: targets
    # What release-image.yml may use, and no more: a called workflow cannot exceed its caller.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    uses: ./.github/workflows/release-image.yml
    with:
      component: ${{ matrix.component }}
      ref: ${{ fromJSON(needs.targets.outputs.target).ref }}
      kind: release
      tag: ${{ fromJSON(needs.targets.outputs.target).tag }}
      latest: ${{ fromJSON(needs.targets.outputs.target).latest }}
      publish: true

  # Publishes the draft only once it lists every image's digest, SBOM and checksums: after that
  # the release is immutable, and nothing can be added to it.
  publish-release:
    needs: [release-please, targets, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          LATEST: ${{ fromJSON(needs.targets.outputs.target).latest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          release=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,assets)
          if [[ "$(jq -r .isDraft <<<"${release}")" != true ]]; then
            echo "::notice::${TAG} is already published."
            exit 0
          fi
          missing=()
          for component in backend frontend; do
            for ext in digest spdx.json sha256; do
              name="bancwr-diogel-${component}-${version}.${ext}"
              jq -e --arg name "${name}" 'any(.assets[]; .name == $name)' <<<"${release}" >/dev/null \
                || missing+=("${name}")
            done
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${TAG} stays a draft: it does not list ${missing[*]}."
            exit 1
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${LATEST}"
          echo "Published ${TAG}"

  # The milestone named after the version (for example 0.1.0) is the release's scope. It is done
  # once the release is published. A missing milestone is not an error: not every release has one.
  close-milestone:
    needs: [release-please, publish-release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the version's milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number")"
          if [ -z "$number" ]; then
            echo "::notice::No open milestone named $VERSION; nothing to close."
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$number" -f state=closed --silent
          echo "Closed milestone $VERSION (#$number)"
