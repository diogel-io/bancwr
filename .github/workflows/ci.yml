name: CI

on:
  # No paths filter: test / backend-test and test / frontend-check are required checks on master,
  # so they must report on every pull request, or one that touches only docs could never merge.
  pull_request:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/bancwr-diogel-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/bancwr-diogel-frontend

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # Backend and frontend tests, lint and typecheck (#36). Also run by both release workflows.
  test:
    uses: ./.github/workflows/test.yml

  # Which commits a release builds and which tags it publishes, above all that :latest only ever
  # goes to the highest stable release (#15).
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/test-release-scripts.sh

  # Every variable .env.example documents reaches the service that reads it under compose (#83).
  compose-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/test-compose-env.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image_name: ${{ github.repository_owner }}/bancwr-diogel-backend
            # Shared with release-backend.yml, so a release reuses the layers CI built.
            cache_scope: backend-cargo-chef
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: ${{ github.repository_owner }}/bancwr-diogel-frontend
            cache_scope: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=,suffix=,format=short

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (not pushed)
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only, matching the release workflows. Emulated arm64 took ~93 min of a
          # 98 min backend build (#39); build arm64 on a native runner if it is ever published.
          platforms: linux/amd64
          push: false
          # Loaded into the runner's Docker, so the image that would ship can be scanned (#16).
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            bancwr-${{ matrix.component }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          # One scope per component: unscoped, the two matrix jobs overwrote each other's cache.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      # What ships (#16): every critical and high in the image, fixed or not, to code scanning.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bancwr-${{ matrix.component }}:ci
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload the image scan
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: 'trivy-image.sarif'
          # Its own category: sharing one with the filesystem scan below made each upload replace
          # the other's results, which is how the base-image findings disappeared from view (#16).
          category: trivy-image-${{ matrix.component }}

      # The gate: a critical or high that has a fix, in what ships, fails the build. Findings with
      # no fix yet are reported above but cannot be acted on, so they do not block. Accepted
      # exceptions go in .trivyignore, each with a reason and a review date. See docs/releasing.md.
      - name: Gate on fixable critical and high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bancwr-${{ matrix.component }}:ci
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'
          # The SARIF scan above already fetched the vulnerability database.
          skip-setup-trivy: true

      # The lockfiles, including build-time dependencies that never ship: report-only.
      - name: Scan the dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.context }}'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload the dependency scan
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: 'trivy-fs.sarif'
          category: trivy-fs-${{ matrix.component }}

  # End-to-end tests against the real stack: both images, the frontend proxy and the bunker (#46).
  # Report-only: it is not a required check, so a failure shows on the PR without blocking it.
  # It lives here, not in a workflow the release workflows call, so the stack is built and booted
  # once per push rather than once per workflow.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # After `build`, so these are cache hits. cache-from only: the build job owns those caches.
      - name: Load backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bancwr-backend:e2e
          cache-from: type=gha,scope=backend-cargo-chef

      - name: Load frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bancwr-frontend:e2e
          cache-from: type=gha,scope=frontend

      # Version from the packageManager field in frontend/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Global setup generates a throwaway bunker key, starts e2e/compose.e2e.yaml from the images
      # loaded above (E2E_BUILD=0), and tears it down after saving the container logs.
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          E2E_BUILD: '0'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
