name: Release image

# Builds, scans and publishes one image for one target (#15), shared by release-backend.yml and
# release-frontend.yml so their tags cannot drift apart. Nothing is published unless the tests
# (#36) and the vulnerability gate (#16) pass for the target's own commit. With publish: false
# the run stops after printing the tags it would push.
#
# A release target's image is then signed, and given build provenance and an SBOM, all keyless
# under this workflow's GitHub OIDC identity, and the SBOM and digest are added to the GitHub
# release (#104). Trunk images are not signed. docs/releasing.md, "Verifying an image".
on:
  workflow_call:
    inputs:
      component:
        description: backend or frontend.
        type: string
        required: true
      ref:
        description: The commit to build (a sha, branch or tag ref).
        type: string
        required: true
      kind:
        description: trunk or release.
        type: string
        required: true
      tag:
        description: The v* tag, for a release.
        type: string
        default: ''
      latest:
        description: Whether this release is the highest stable one, and so takes :latest.
        type: boolean
        default: false
      publish:
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/version.yml
    with:
      ref: ${{ inputs.ref }}

  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref }}

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    # id-token and attestations are used only for a release target (#104): to sign, and to store
    # the provenance and SBOM attestations. The callers grant them.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bancwr-diogel-${{ inputs.component }}
      LOCAL: bancwr-${{ inputs.component }}:release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The tag rules from the run's own commit: the target may be older (a release rebuilt
      # weekly, or master previewed from a branch) and carry other rules, or none.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: .github/scripts

      # A release's version is its tag. GitVersion is used for trunk only: in Actions it takes the
      # branch from GITHUB_REF, not the checkout, so a weekly rebuild of v0.1.0 (run on master)
      # would otherwise be versioned as master, e.g. 0.1.1-5.
      - name: Version
        id: version
        env:
          KIND: ${{ inputs.kind }}
          TAG: ${{ inputs.tag }}
          SEMVER: ${{ needs.version.outputs.semVer }}
        run: |
          if [[ "${KIND}" == release ]]; then version="${TAG#v}"; else version="${SEMVER}"; fi
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: tags
        env:
          KIND: ${{ inputs.kind }}
          SEMVER: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SHA=$(git rev-parse HEAD) bash release-tools/.github/scripts/image-tags.sh > tags.txt
          echo "Tags for ${IMAGE} at $(git rev-parse --short HEAD):"
          sed 's/^/  /' tags.txt
          { echo 'list<<EOF'; cat tags.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      # The release PR bumps compose.yaml with the version (docs/releasing.md); a tag whose
      # compose.yaml names another version is published anyway, with a warning to fix it.
      - name: Check compose.yaml names this release
        if: inputs.kind == 'release'
        env:
          TAG: ${{ inputs.tag }}
          COMPONENT: ${{ inputs.component }}
        run: |
          version="${TAG#v}"
          if ! grep -qF "bancwr-diogel-${COMPONENT}:${version}" compose.yaml; then
            echo "::warning file=compose.yaml::compose.yaml does not pin bancwr-diogel-${COMPONENT}:${version}. Check its x-release-please-version markers (docs/releasing.md)."
          fi

      - uses: docker/setup-buildx-action@v3

      # Built and loaded, not pushed: the image is scanned before anything is published (#16).
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.component }}
          platforms: linux/amd64
          load: true
          # Fresh base images every time, so the weekly rebuild actually picks up their fixes.
          pull: true
          tags: |
            ${{ steps.tags.outputs.list }}
            ${{ env.LOCAL }}
          build-args: |
            BANCWR_VERSION=${{ steps.version.outputs.version }}
          # Shared with ci.yml's build, so a release reuses the layers CI built.
          cache-from: type=gha,scope=${{ inputs.component == 'backend' && 'backend-cargo-chef' || 'frontend' }}
          cache-to: type=gha,scope=${{ inputs.component == 'backend' && 'backend-cargo-chef' || 'frontend' }},mode=max
          # Off: buildx provenance would push an index around the image rather than the image
          # Trivy scanned. Provenance is attested to the pushed digest below instead (#104).
          provenance: false

      # The same gate as ci.yml: no fixable critical or high finding is ever published.
      - name: Gate on fixable critical and high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly the image that was scanned, under the tags printed above, and no others.
      - name: Publish
        if: inputs.publish
        run: |
          while read -r tag; do
            docker push "${tag}"
          done < tags.txt

      - name: Not published
        if: ${{ !inputs.publish }}
        run: echo "::notice::publish is false, so nothing was pushed. Tags above are what would have been."

      # Everything below is for a release target only (#104), and acts on the digest, never a tag.
      # The digest is read from the local image, which every tag above was pushed from, so a trunk
      # run writing the same sha- tag at the same moment cannot change what is signed.
      - name: Digest
        id: digest
        if: inputs.publish && inputs.kind == 'release'
        run: |
          set -euo pipefail
          mapfile -t digests < <(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${LOCAL}" | grep -F "${IMAGE}@sha256:" | sort -u)
          if [[ ${#digests[@]} -ne 1 ]]; then
            echo "::error::Expected one pushed digest for ${IMAGE}, found ${#digests[@]}: ${digests[*]:-none}"
            exit 1
          fi
          digest="${digests[0]#"${IMAGE}@"}"
          echo "Published ${IMAGE}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish && inputs.kind == 'release'

      # Keyless: the certificate names this workflow, the ref it ran from and the commit, and the
      # signature is logged in the public Rekor transparency log. No key is kept anywhere.
      - name: Sign
        if: inputs.publish && inputs.kind == 'release'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: inputs.publish && inputs.kind == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # A storage record needs artifact-metadata: write, and adds nothing to verification.
          create-storage-record: false

      # The packages in the published image, from the same scanner as the gate.
      - name: SBOM
        if: inputs.publish && inputs.kind == 'release'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: 'spdx-json'
          output: 'sbom.spdx.json'
          # The gate above already set Trivy up.
          skip-setup-trivy: true

      - name: Attest SBOM
        if: inputs.publish && inputs.kind == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      # The documented check, run on what was just published, so a signature the documented
      # command would reject fails the release instead of being found by an operator.
      - name: Verify as an operator would
        if: inputs.publish && inputs.kind == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: bash release-tools/.github/scripts/verify-image.sh "${IMAGE}@${DIGEST}"

      - name: Keep the SBOM for the release
        if: inputs.publish && inputs.kind == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.component }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  # The SBOM, the digest and their checksums on the GitHub release (#104). Its own job, so only
  # this one can write to the repository. A rebuild replaces them: the release always lists the
  # digest its version tag points at now.
  release-assets:
    needs: release
    if: inputs.publish && inputs.kind == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NAME: bancwr-diogel-${{ inputs.component }}-${{ needs.release.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/bancwr-diogel-${{ inputs.component }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-${{ inputs.component }}

      - name: Add to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          set -euo pipefail
          # A tag pushed by hand has no GitHub release (docs/releasing.md): the image is still
          # signed and attested, so say so rather than fail.
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning::No GitHub release for ${TAG}, so its SBOM and digest were not attached."
            exit 0
          fi
          mv sbom.spdx.json "${NAME}.spdx.json"
          echo "${IMAGE}@${DIGEST}" > "${NAME}.digest"
          sha256sum "${NAME}.spdx.json" "${NAME}.digest" > "${NAME}.sha256"
          cat "${NAME}.digest" "${NAME}.sha256"
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "${NAME}.spdx.json" "${NAME}.digest" "${NAME}.sha256"
