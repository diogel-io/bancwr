name: Release Backend

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    uses: ./.github/workflows/version.yml

  # Publish nothing unless the full test suite passes for this commit (#36). CI does not run on
  # v* tags, so for a release tag this is the only test gate.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bancwr-diogel-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            # The GitVersion version: 0.1.0-49 on master, 0.1.0 on the v0.1.0 tag.
            # semVer, not fullSemVer: fullSemVer can carry '+' build metadata, which image tags reject.
            type=raw,value=${{ needs.version.outputs.semVer }}
            # :latest tracks the default branch. Both the README quickstart and
            # trivy-security.yml reference :latest, and neither worked before this,
            # because metadata-action only adds it for a semver tag and none has been cut.
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BANCWR_VERSION=${{ needs.version.outputs.semVer }}
          cache-from: type=gha,scope=backend-cargo-chef
          cache-to: type=gha,scope=backend-cargo-chef,mode=max
          provenance: false