name: Release Frontend

# Publishes the frontend image (#15): see release-image.yml for the build, gates and tags, and
# docs/releasing.md for what each tag means.
#   push to master        :edge, :master, :sha-…, :<semVer>
#   push of a v* tag      :<version>, :<major>.<minor>, :sha-…, and :latest if it is the highest
#   weekly                both: master, and the newest release on fresh base images (#16)
on:
  push:
    branches: [master]
    tags: ['v*']
  # Mondays 05:00 UTC, an hour before trivy-security.yml. GitHub disables schedules after 60 days
  # without repository activity: see docs/releasing.md.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: master, or a v* tag to rebuild
        type: string
        default: ''
      publish:
        description: Push the images. Off to see which tags a run would publish.
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  targets:
    uses: ./.github/workflows/release-targets.yml
    with:
      ref: ${{ inputs.ref }}

  release:
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    uses: ./.github/workflows/release-image.yml
    with:
      component: frontend
      ref: ${{ matrix.target.ref }}
      kind: ${{ matrix.target.kind }}
      tag: ${{ matrix.target.tag }}
      latest: ${{ matrix.target.latest }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
