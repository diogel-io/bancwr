name: Trivy Security Scan

# What people pull, scanned weekly and reported to code scanning (#16, #15): :latest, the newest
# release (what self-hosters run), and :edge, trunk (what is coming). Report only: the release
# workflows gate on fixable critical and high findings before publishing. A channel not yet
# published (no release before v0.1.0) is skipped with a notice rather than failing.
on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00, an hour after the weekly rebuild
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
        channel: [latest, edge]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bancwr-diogel-${{ matrix.component }}:${{ matrix.channel }}
      # :latest keeps #16's category; :edge gets its own, so neither replaces the other.
      CATEGORY: ${{ matrix.channel == 'latest' && format('trivy-published-{0}', matrix.component) || format('trivy-edge-{0}', matrix.component) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is it published?
        id: published
        run: |
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${IMAGE} is not published yet, so it was not scanned."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        if: steps.published.outputs.yes == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: steps.published.outputs.yes == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ env.CATEGORY }}
