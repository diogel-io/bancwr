services:
    bunker:
      # A released version, bumped by each release PR (docs/releasing.md). :edge is trunk.
      image: ghcr.io/diogel-io/bancwr-diogel-backend:0.1.0 # x-release-please-version
      container_name: bancwr-bunker
      restart: unless-stopped
      # No published port: only the frontend reaches the bunker, over the compose network.
      # The image has no shell or curl (#16); it checks itself. Podman ignores an image's own
      # HEALTHCHECK, so it is repeated here. By hand: podman exec bancwr-bunker bunker healthcheck
      healthcheck:
        test: ["CMD", "bunker", "healthcheck"]
        interval: 30s
        timeout: 5s
        start_period: 5s
        retries: 3
      environment:
        # The bunker's key is encrypted at rest in ./data/bunker-key.enc (#94), under this root
        # credential. Create both once with `bunker import-key`: see docs/operating.md.
        - BANCWR_ROOT_KEY_FILE=/run/secrets/bancwr_root_key
        # Encrypts `bunker backup` archives (#95). A passphrase of 16 characters or more, not the
        # root credential: see "Backing up the bunker" in docs/operating.md.
        - BANCWR_BACKUP_KEY_FILE=/run/secrets/bancwr_backup_key
        # The first administrator's npub, registered at startup while no administrator exists.
        - BANCWR_ADMIN_PUBKEY=${BANCWR_ADMIN_PUBKEY:-}
        # Signs the caller's identity between frontend and bunker; both services read it. Required.
        - BANCWR_PROXY_SECRET=${BANCWR_PROXY_SECRET:?Set BANCWR_PROXY_SECRET in .env (openssl rand -hex 32)}
        - BUNKER_PORT=3000
        - RUST_LOG=info
        - DATABASE_PATH=/data/bancwr.db
        # NIP-46 (#83): on unless .env says false. On connects no app by itself: each needs a
        # connection token an administrator issues.
        - NIP46_ENABLED=${NIP46_ENABLED:-true}
        # Empty uses the relays an administrator chooses under Config, Bunker relays (#78). When
        # set, it overrides them and the console shows it read-only.
        - NIP46_RELAYS=${NIP46_RELAYS:-}
      # The bunker runs as UID 65532 (#16), so ./data must be writable by it. Once, before the first
      # start: podman unshare chown -R 65532:65532 ./data   (rootless Podman)
      #        sudo chown -R 65532:65532 ./data             (Docker)
      volumes:
        - ./data:/data:Z
      # 64 hex characters (openssl rand -hex 32), owned by UID 65532, mode 0400. Never stored with
      # the backups of ./data: the two together are the key.
      secrets:
        - bancwr_root_key
        # Owned by UID 65532, mode 0400. Kept apart from the archives it encrypts.
        - bancwr_backup_key

    frontend:
      # The same version as the bunker: they are released together.
      image: ghcr.io/diogel-io/bancwr-diogel-frontend:0.1.0 # x-release-please-version
      container_name: bancwr-frontend
      restart: unless-stopped
      # Loopback only: sign-in needs HTTPS (http:// works only on localhost), so put a TLS reverse
      # proxy in front and point it here. See "HTTPS" in README.md.
      ports:
        - "127.0.0.1:3001:3000"
      environment:
        - NUXT_API_BASE=http://bunker:3000
        - NUXT_PROXY_SECRET=${BANCWR_PROXY_SECRET:?Set BANCWR_PROXY_SECRET in .env (openssl rand -hex 32)}
        # Seals the session cookie. Required.
        - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in .env (openssl rand -hex 32)}
        # The https origin people open Bancwr on. Required.
        - NUXT_SITE_ORIGIN=${NUXT_SITE_ORIGIN:?Set NUXT_SITE_ORIGIN in .env, such as https://bancwr.example}
        # Optional: the profile page's relays and image server (#30). Empty uses the defaults.
        - NUXT_PUBLIC_PROFILE_RELAYS=${NUXT_PUBLIC_PROFILE_RELAYS:-}
        - NUXT_PUBLIC_INDEXER_RELAYS=${NUXT_PUBLIC_INDEXER_RELAYS:-}
        - NUXT_PUBLIC_BLOSSOM_SERVER=${NUXT_PUBLIC_BLOSSOM_SERVER:-}
      depends_on:
        - bunker

secrets:
    bancwr_root_key:
      file: ./secrets/bancwr_root_key
    bancwr_backup_key:
      file: ./secrets/bancwr_backup_key
